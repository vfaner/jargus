# ============================================================
# 百目 JArgus - 生产/容器环境配置
# 通过环境变量覆盖，未设置时使用括号内默认值
# ============================================================

app:
  # 默认开启登录鉴权（可用 APP_AUTH_ENABLED=false 关闭）
  auth-enabled: ${APP_AUTH_ENABLED:true}
  sso:
    # 破窗：配置错误导致无法登录时，临时置 true 启动一次以恢复本地登录
    reset-local-login: ${APP_SSO_RESET_LOCAL_LOGIN:false}
  security:
    # 网关头认证只信任这些直连代理地址（IP 或 CIDR），默认仅本机
    trusted-proxies: ${APP_TRUSTED_PROXIES:127.0.0.1,::1}
  # JWT 签名密钥：未注入 APP_JWT_SECRET 时每次启动随机生成（重启/重建后需重新登录，
  # 且不存在可被伪造的公开默认密钥）；需跨重启保留登录态才注入固定值
  jwt-secret: ${APP_JWT_SECRET:}
  jwt-expire-hours: ${APP_JWT_EXPIRE_HOURS:24}
  # AES 密钥（库内密码等敏感字段的静态加密）：生产环境务必通过环境变量注入
  crypto-key: ${APP_CRYPTO_KEY:a1b2c3d4e5f6g7h8}
  work-dir: ${APP_WORK_DIR:/app/work}
  driver-dir: ${APP_DRIVER_DIR:/app/lib/custom}

# 日志输出到容器卷
logging:
  file:
    name: ${LOG_FILE:/app/logs/jargus.log}
  level:
    root: INFO
    com.qqmu.jargus: INFO

# 生产环境开启 Thymeleaf 模板缓存（base yml 为开发便利关闭了它）
spring:
  thymeleaf:
    cache: true

# 默认 H2 文件库（数据落在 /app/data 持久化卷）
# 切换外部 MySQL/PG 时，在后台「数据库配置」中配置即可，无需修改本文件
datasource:
  default:
    url: ${DATASOURCE_URL:jdbc:h2:file:/app/data/jargus;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${DATASOURCE_USERNAME:sa}
    password: ${DATASOURCE_PASSWORD:}

# 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
